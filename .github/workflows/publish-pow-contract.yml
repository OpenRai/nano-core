name: Publish Nano PoW Contract

on:
  push:
    tags:
      - 'nano-pow-contract-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release source
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#nano-pow-contract-v}"
          package_version="$(node -p 'require("./packages/nano-pow-contract/package.json").version')"
          test "$tag_version" = "$package_version"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish contract
        run: pnpm --filter @openrai/nano-pow-contract publish --access public --no-git-checks --provenance
